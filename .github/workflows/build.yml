name: Build MikuMusic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 自动解压: 仓库根目录放 mikumusic.zip 即可, Actions 解压成项目 ----
      - name: Extract project zip
        run: |
          set -e
          if [ -f mikumusic.zip ]; then unzip -q mikumusic.zip; fi
          if [ -d mikumusic ]; then cd mikumusic; fi
          ls -la
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mikumusic-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          overwrite: true
