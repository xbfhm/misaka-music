name: Build MisakaMusic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 自动解压: 根目录任意 zip 都行 (大小写不限: *.zip *.Zip *.ZIP), 解压后自动定位项目 ----
      - name: Extract project zip
        run: |
          set -e
          # 解压根目录所有 zip (兼容 mikumusic.zip / MisakaMusic.zip / MISAKAMUSIC.ZIP / 任意命名)
          for f in *.zip *.Zip *.ZIP; do
            if [ -f "$f" ]; then
              echo "解压: $f"
              unzip -q -o "$f"
            fi
          done
          # 定位包含 settings.gradle 的项目目录 (最多往下三层, 兼容嵌套/大小写不同的目录名)
          if [ ! -f settings.gradle ]; then
            PROJ=$(find . -maxdepth 3 -name settings.gradle -print -quit 2>/dev/null || true)
            if [ -n "$PROJ" ]; then
              cd "$(dirname "$PROJ")"
            fi
          fi
          pwd
          ls -la
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: misakamusic-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          overwrite: true
